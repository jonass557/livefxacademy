# Blueprint Render — déploiement du backend LiveFx Academy
# Doc : https://render.com/docs/blueprint-spec
services:
  - type: web
    name: livefx-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 18
      # Les valeurs ci-dessous sont à renseigner dans le dashboard Render
      # (onglet Environment) — ne jamais committer les secrets.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false

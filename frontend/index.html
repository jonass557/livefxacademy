    <script>
      // Protection universelle du DOM contre l'erreur "Failed to execute 'insertBefore' / 'removeChild' on 'Node'"
      // causée par les traducteurs automatiques de navigateurs (Chrome/Safari), extensions ou lecteurs médias.
      (function () {
        if (typeof Node === 'function' && Node.prototype) {
          var originalRemoveChild = Node.prototype.removeChild;
          Node.prototype.removeChild = function (child) {
            if (child && child.parentNode !== this) {
              if (child.parentNode) {
                try {
                  return originalRemoveChild.call(child.parentNode, child);
                } catch (_) {}
              }
              return child;
            }
            try {
              return originalRemoveChild.apply(this, arguments);
            } catch (_) {
              return child;
            }
          };

          var originalInsertBefore = Node.prototype.insertBefore;
          Node.prototype.insertBefore = function (newNode, referenceNode) {
            if (referenceNode && referenceNode.parentNode !== this) {
              try {
                return this.appendChild(newNode);
              } catch (_) {
                return newNode;
              }
            }
            try {
              return originalInsertBefore.apply(this, arguments);
            } catch (_) {
              try {
                return this.appendChild(newNode);
              } catch (_e) {
                return newNode;
              }
            }
          };
        }
      })();

      // Rechargement automatique en cas de mise à jour des versions JavaScript sur le serveur
      window.addEventListener('vite:preloadError', function () {
        window.location.reload();
      });

name: Deploy backend to cPanel

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-backend-cpanel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT || '22' }}
    steps:
      - name: Deploy through SSH
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_USERNAME: ${{ secrets.CPANEL_SSH_USERNAME }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/cpanel_deploy_key"
          known_hosts_file="$RUNNER_TEMP/cpanel_known_hosts"
          printf '%s\n' "$CPANEL_SSH_KEY" > "$key_file"
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"

          ssh -i "$key_file" \
            -p "$CPANEL_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" \
            "$CPANEL_SSH_USERNAME@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd ~/repos/livefxacademy

          # Never overwrite production configuration or unrelated server changes.
          if [ -n "$(git status --porcelain --untracked-files=all -- . ':!.env' ':!backend/.env')" ]; then
            echo "Deployment stopped: application changes exist on the server."
            git status --short -- . ':!.env' ':!backend/.env'
            exit 1
          fi

          before="$(git rev-parse HEAD)"
          git fetch origin main
          git merge --ff-only origin/main
          after="$(git rev-parse HEAD)"

          if [ "$before" != "$after" ] && ! git diff --quiet "$before" "$after" -- backend/package.json backend/package-lock.json backend/npm-shrinkwrap.json; then
            cd backend
            npm ci --omit=dev
            cd ..
          fi

          # Passenger watches this file and restarts the cPanel Node.js app.
          mkdir -p backend/tmp
          touch backend/tmp/restart.txt
          echo "Backend deployed at $after"
          REMOTE_SCRIPT